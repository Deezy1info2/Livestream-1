<div class="custom-stream-card-widget" style="width:100%; max-width:380px; font-family:system-ui, -apple-system, sans-serif; box-sizing:border-box; margin: 10px auto;">
    
    <div onclick="initiateSecurePlaybackWindow('Real Madrid VS Manchester City', 'https://www.youtube.com/embed/dQw4w9WgXcQ', [{&quot;id&quot;:1,&quot;label&quot;:&quot;Server 1&quot;,&quot;url&quot;:&quot;https://www.youtube.com/embed/dQw4w9WgXcQ&quot;},{&quot;id&quot;:2,&quot;label&quot;:&quot;Server 2&quot;,&quot;url&quot;:&quot;https://player.vimeo.com/video/76979871&quot;}])" 
         style="background:linear-gradient(135deg, #0f172a 0%, #111827 100%); border:1px solid #1f2937; border-radius:16px; padding:20px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.4); cursor:pointer; transition: all 0.2s ease; position:relative;"
         onmouseover="this.style.borderColor='#f97316'" onmouseout="this.style.borderColor='#1f2937'">
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <span style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#9ca3af; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px;">UEFA Champions League</span>
            <span style="padding:2px 8px; border-radius:4px; font-size:10px; font-weight:800; text-transform:uppercase; background-color:#dc2626; color:#ffffff; tracking-wider:0.05em;">LIVE</span>
        </div>
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin:20px 0;">
            <div style="display:flex; flex-direction:column; align-items:center; flex:1; text-align:center; min-width:0;">
                <img src="https://crests.football-data.org/86.png" style="width:56px; height:56px; object-fit:contain; margin-bottom:8px;" alt="Home Logo">
                <span style="font-size:13px; font-weight:700; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;">Real Madrid</span>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center; padding:0 12px;">
                <span style="font-size:11px; color:#4b5563; font-weight:900; letter-spacing:0.1em;">VS</span>
                <div style="height:1px; width:24px; background-color:#374151; margin:4px 0;"></div>
                <span style="font-size:10px; color:#f97316; background-color:rgba(124,45,18,0.2); border:1px solid rgba(154,52,18,0.3); padding:2px 6px; border-radius:4px; font-family:monospace;">90'</span>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center; flex:1; text-align:center; min-width:0;">
                <img src="https://crests.football-data.org/65.png" style="width:56px; height:56px; object-fit:contain; margin-bottom:8px;" alt="Away Logo">
                <span style="font-size:13px; font-weight:700; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;">Manchester City</span>
            </div>
        </div>

        <div style="text-align:center; font-size:11px; color:#9ca3af; background-color:rgba(3,7,18,0.4); border:1px solid rgba(31,41,55,0.5); padding:8px; border-radius:10px; pointer-events:none;">
            📅 <span>2026-06-05</span> &nbsp;|&nbsp; 🕒 <span>21:00</span>
        </div>
        
        <div style="text-align:center; margin-top:10px; font-size:10px; color:#f97316; font-weight:600;"><i class="fa-solid fa-play"></i> Tap Card to Stream Live</div>
    </div>

    <div id="global_player_modal_screen" style="display:none; position:fixed; inset:0; background-color:rgba(0,0,0,0.92); backdrop-filter:blur(10px); z-index:99999; justify-content:center; align-items:center; padding:16px;">
        <div style="background-color:#111827; border:1px solid #1f2937; border-radius:16px; w-full; max-width:768px; width:100%; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
            <div style="display:flex; justify-content:space-between; align-items:center; background-color:#030712; padding:12px 16px; border-bottom:1px solid #1f2937;">
                <span id="g_modal_title" style="font-size:12px; font-weight:700; color:#d1d5db; text-transform:uppercase; letter-spacing:0.05em;">Match Stream</span>
                <button onclick="destroyGlobalPlaybackEngine()" style="background:none; border:none; color:#9ca3af; font-size:20px; cursor:pointer; line-height:1;">&times;</button>
            </div>
            <div id="g_video_wrapper" style="position:relative; width:100%; aspect-ratio:16/9; background-color:#000000;">
                <iframe id="g_modal_iframe" src="" style="position:absolute; width:100%; height:100%; border:0;" 
                        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allowfullscreen="true"></iframe>
                <button onclick="toggleGlobalFullscreenView()" style="position:absolute; bottom:12px; right:12px; z-index:10; background-color:rgba(0,0,0,0.7); border:1px solid #374151; color:#ffffff; padding:6px 12px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;">⛶ Fullscreen</button>
            </div>
            <div style="padding:16px; background-color:#030712; border-t:1px solid #1f2937;">
                <div style="font-size:11px; font-weight:700; color:#6b7280; text-transform:uppercase; margin-bottom:8px; letter-spacing:0.05em;">Backup Channels List:</div>
                <div id="g_modal_servers" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
            </div>
        </div>
    </div>

    <script>
        function initiateSecurePlaybackWindow(title, targetStream, streamsCollection) {
            var modal = document.getElementById('global_player_modal_screen');
            document.getElementById('g_modal_title').innerText = title;
            document.getElementById('g_modal_iframe').src = targetStream;
            
            var container = document.getElementById('g_modal_servers');
            container.innerHTML = '';
            
            if(streamsCollection && streamsCollection.length > 0) {
                streamsCollection.forEach(function(stream) {
                    var isCurrent = stream.url === targetStream;
                    var btn = document.createElement('button');
                    btn.innerText = stream.label;
                    btn.style.padding = '6px 12px';
                    btn.style.borderRadius = '6px';
                    btn.style.fontSize = '11px';
                    btn.style.fontWeight = '700';
                    btn.style.border = '1px solid ' + (isCurrent ? '#f97316' : '#374151');
                    btn.style.backgroundColor = isCurrent ? '#ea580c' : '#1f2937';
                    btn.style.color = '#ffffff';
                    btn.style.cursor = 'pointer';
                    btn.onclick = function() {
                        initiateSecurePlaybackWindow(title, stream.url, streamsCollection);
                    };
                    container.appendChild(btn);
                });
            }
            modal.style.display = 'flex';
        }

        function destroyGlobalPlaybackEngine() {
            document.getElementById('g_modal_iframe').src = '';
            document.getElementById('global_player_modal_screen').style.display = 'none';
        }

        function toggleGlobalFullscreenView() {
            var element = document.getElementById('g_video_wrapper');
            if (!document.fullscreenElement) {
                if(element.requestFullscreen) { element.requestFullscreen(); }
                else if(element.webkitRequestFullscreen) { element.webkitRequestFullscreen(); }
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</div>
